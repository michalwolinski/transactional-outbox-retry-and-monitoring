services:
  db:
    # Pinned by digest: uuidv7() needs PostgreSQL 18, and the planner checks in the tests are only
    # as stable as the version they ran on.
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: outbox
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U outbox -d outbox']
      interval: 1s
      timeout: 3s
      retries: 30

  cli:
    build:
      context: .
    image: transactional-outbox:php-8.6.0RC4
    working_dir: /app
    environment:
      OUTBOX_DSN: 'pgsql:host=db;port=5432;dbname=outbox;user=outbox;password=outbox'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./bin:/app/bin
      - ./database:/app/database
      - ./public:/app/public
      - /app/vendor

  # The scrape target: `docker compose up metrics`, then curl localhost:9464/metrics
  metrics:
    image: transactional-outbox:php-8.6.0RC4
    working_dir: /app
    command: ['php', '-S', '0.0.0.0:9464', 'public/metrics.php']
    environment:
      OUTBOX_DSN: 'pgsql:host=db;port=5432;dbname=outbox;user=outbox;password=outbox'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '9464:9464'
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/vendor
